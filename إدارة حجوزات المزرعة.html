<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة حجوزات المزرعة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ea;--card:#fff;--ink:#1d2b22;--mute:#5d6b61;--line:#d5ddd0;--pine:#33565a;--pine-t:#fff;--amber:#a47c41;--amber-bg:#fbefd5;--ok-bg:#d9e8e8;--red:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b16;--card:#1d2720;--ink:#e8efe7;--mute:#9fb0a3;--line:#33443a;--pine:#6fb3b8;--pine-t:#0f1a13;--amber:#e6b455;--amber-bg:#3a3017;--ok-bg:#1f3a3c;--red:#ef8a80}}
:root[data-theme="dark"]{--bg:#141b16;--card:#1d2720;--ink:#e8efe7;--mute:#9fb0a3;--line:#33443a;--pine:#6fb3b8;--pine-t:#0f1a13;--amber:#e6b455;--amber-bg:#3a3017;--ok-bg:#1f3a3c;--red:#ef8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 14px}
h2{font-size:1.1rem;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--pine);background:var(--pine);color:var(--pine-t);border-radius:6px;padding:8px 14px;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--pine)}
button.del{border-color:var(--red);color:var(--red);background:transparent}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.sum div{background:var(--bg);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-size:1.25rem}
.sum span{font-size:.8rem;color:var(--mute)}
.bk{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
.bk .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{font-size:.78rem;border-radius:99px;padding:1px 10px;background:var(--ok-bg)}
.tag.dep{background:var(--amber-bg);color:var(--amber)}
.meta{font-size:.88rem;color:var(--mute);margin:4px 0}
.empty{color:var(--mute);text-align:center;padding:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.ch{text-align:center;font-size:.75rem;color:var(--mute)}
.cd{min-height:46px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:.85rem;overflow:hidden}
.cd small{display:block;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.cd{background:var(--card);color:var(--ink);text-align:start;font:inherit;font-size:.85rem;width:100%;cursor:pointer}
.cd.sel{outline:2px solid var(--pine);outline-offset:1px}
.cd.bkd{background:var(--ok-bg);border-color:var(--pine)}
.cd.bkd.dep{background:var(--amber-bg);border-color:var(--amber)}
.cd.bkd.done{background:var(--line);border-color:var(--mute);color:var(--mute)}
.hd{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 14px}
.hd img{height:72px;width:auto;max-width:40%}
.hd h1{margin:0;color:#33565a;font-size:1.35rem}
.hd .sub{margin:0;color:#a47c41;font-weight:600}
</style>
</head>

<section>
<h2 id="formTitle">حجز جديد</h2>
<div class="grid">
<div><label for="name">اسم المستأجر</label><input id="name"></div>
<div><label for="kind">نوع الحجز</label><select id="kind"><option>عائلة</option><option>جروب</option></select></div>
<div><label for="persons">كم شخص</label><input id="persons" type="number" min="1" inputmode="numeric"></div>
<div><label for="from">من تاريخ</label><input id="from" type="date"></div>
<div><label for="to">إلى تاريخ</label><input id="to" type="date"></div>
<div><label for="gross">السعر قبل الخصم (محسوب)</label><input id="gross" readonly></div>
<div><label for="discount">الخصم</label><input id="discount" type="number" min="0" inputmode="decimal"></div>
<div><label for="extra">مبلغ إضافي</label><input id="extra" type="number" min="0" inputmode="decimal"></div>
<div><label for="total">السعر الكلي (بعد الخصم والإضافي)</label><input id="total" readonly></div>
<div class="full meta" id="calc"></div>
<div><label for="paid">المبلغ المدفوع</label><input id="paid" type="number" min="0" inputmode="decimal"></div>
<div><label for="status">حالة الدفع</label><select id="status"><option>عربون</option><option>مدفوع بالكامل</option></select></div>
<div><label for="method">طريقة الدفع</label><select id="method"><option>شام كاش</option><option>تحويل</option></select></div>
<div class="full"><label for="weather">الحرارة وتوقعات الجو</label><input id="weather" placeholder="تُعبّأ تلقائياً حسب تاريخ الحجز"></div>
<div class="full meta" id="wnote"></div>
<div class="full"><label for="notes">ملاحظات</label><textarea id="notes"></textarea></div>
</div>
<div class="row" style="margin-top:10px">
<button id="save">حفظ الحجز</button>
<button id="cancel" class="ghost" hidden>إلغاء التعديل</button>
<a id="wlink" class="btn ghost" target="_blank" rel="noopener" href="#">عرض درجة الحرارة في حلب</a>
</div>
<p id="msg" class="meta" role="status"></p>
</section>

<section>
<div class="row" style="justify-content:space-between">
<h2>الجرد الشهري</h2>
<input id="month" type="month" style="width:auto">
</div>
<div id="cal"></div>
<div id="day"></div>
<div class="sum" id="sum"></div>
<div id="list"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const KEY="farm-bookings-v1";
let data=[],editId=null;
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
data.forEach(b=>{if(b.method==="كاش")b.method="شام كاش"});
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){$("msg").textContent="تعذر الحفظ على هذا المتصفح."}}
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString("ar-EG-u-nu-latn");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ids=["name","kind","persons","from","to","gross","discount","extra","total","paid","status","method","weather","notes"];
const now=new Date();
$("month").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");

const FC={"2026-11-14": {"hi": 21, "lo": 9, "rain": 10}, "2026-11-15": {"hi": 22, "lo": 10, "rain": 5}, "2026-11-16": {"hi": 20, "lo": 10, "rain": 60}, "2026-11-17": {"hi": 19, "lo": 10, "rain": 20}, "2026-11-18": {"hi": 20, "lo": 11, "rain": 15}, "2026-11-19": {"hi": 20, "lo": 12, "rain": 15}, "2026-11-20": {"hi": 22, "lo": 13, "rain": 10}, "2026-11-21": {"hi": 22, "lo": 13, "rain": 5}};
const FC_ON="2026-11-14",FC_LAST="2026-11-21";
const fcText=ds=>{const f=FC[ds];return f?`العظمى ${f.hi}° · الصغرى ${f.lo}° · احتمال مطر ${f.rain}%`:""};
let autoW=false;
function autoWeather(){
  const f=$("from").value,note=$("wnote"),t=f?fcText(f):"";
  if(!f){note.textContent="";return}
  if(t){
    if(!$("weather").value||autoW){$("weather").value=t;autoW=true}
    note.textContent="توقعات حلب خان العسل ليوم "+f+" (محدّثة بتاريخ "+FC_ON+")";
  }else{
    if(autoW){$("weather").value="";autoW=false}
    note.textContent="لا توجد توقعات لهذا التاريخ بعد. التوقعات متاحة حتى "+FC_LAST+"، ويمكنك كتابة الدرجة بنفسك.";
  }
}
$("from").addEventListener("change",autoWeather);$("from").addEventListener("input",autoWeather);
$("weather").addEventListener("input",()=>{autoW=false});
const tmp=b=>b.weather?" · "+esc(b.weather)+(/^-?\d+([.,]\d+)?$/.test(String(b.weather).trim())?"°م":""):"";
const RATE=200,RATE_HI=250;
function calc(){
  const f=$("from").value,t=$("to").value||f;
  if(!f||t<f){$("gross").value="";$("total").value="";$("calc").textContent="";return}
  const d=new Date(f+"T00:00:00"),end=new Date(t+"T00:00:00");let reg=0,hi=0;
  for(;d<=end;d.setDate(d.getDate()+1)){const w=d.getDay();(w===4||w===5)?hi++:reg++}
  const gross=reg*RATE+hi*RATE_HI,disc=Math.min(n($("discount").value),gross);
  $("gross").value=gross;const ex=n($("extra").value);$("total").value=gross-disc+ex;
  $("calc").textContent=reg+" يوم × "+RATE+" + "+hi+" خميس/جمعة × "+RATE_HI+(disc?" − خصم "+disc:"")+(ex?" + إضافي "+ex:"");
}
["from","to","discount","extra"].forEach(i=>{$(i).addEventListener("input",calc);$(i).addEventListener("change",calc)});
const LOC="حلب خان العسل";
const WURL="https://www.google.com/search?q="+encodeURIComponent("الطقس في "+LOC);
function updateLink(){
  $("wlink").href=WURL;
}
updateLink();

function reset(){
  ids.forEach(i=>{$(i).value=""});
  $("kind").selectedIndex=0;$("status").selectedIndex=0;$("method").selectedIndex=0;
  editId=null;$("formTitle").textContent="حجز جديد";$("cancel").hidden=true;updateLink();calc();autoW=false;$("wnote").textContent="";
}
$("cancel").onclick=reset;

$("save").onclick=()=>{
  calc();const b={};ids.forEach(i=>b[i]=$(i).value.trim());
  if(!b.name||!b.from){$("msg").textContent="أدخل اسم المستأجر وتاريخ البداية على الأقل.";return}
  if(!b.to)b.to=b.from;
  if(b.to<b.from){$("msg").textContent="تاريخ النهاية قبل تاريخ البداية.";return}
  const clash=data.find(x=>x.id!==editId&&b.from<=x.to&&b.to>=x.from);
  if(clash){$("msg").textContent="هذه التواريخ محجوزة مسبقاً لـ "+clash.name+" (من "+clash.from+" إلى "+clash.to+").";return}
  if(editId){const i=data.findIndex(x=>x.id===editId);b.id=editId;data[i]=b}
  else{b.id=Date.now().toString(36);data.push(b)}
  persist();$("msg").textContent="تم حفظ الحجز.";
  const m=b.from.slice(0,7);$("month").value=m;reset();render();
};

function edit(id){
  const b=data.find(x=>x.id===id);if(!b)return;
  ids.forEach(i=>{$(i).value=b[i]||""});
  editId=id;$("formTitle").textContent="تعديل الحجز";$("cancel").hidden=false;updateLink();calc();autoW=false;$("wnote").textContent="";
  window.scrollTo({top:0,behavior:"smooth"});
}
function remove(id){
  if(!confirm("حذف هذا الحجز؟"))return;
  data=data.filter(x=>x.id!==id);persist();render();
}

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const isDone=b=>b.to<todayStr();
const stars=r=>"★".repeat(r)+"☆".repeat(5-r);
function ratingLine(b){return b.rating?`<div class="meta">التقييم: ${stars(n(b.rating))}${b.review?" · "+esc(b.review):""}</div>`:""}
function ratingBox(b){
  if(!isDone(b))return "";
  const opts=[[5,"ممتاز"],[4,"جيد جداً"],[3,"جيد"],[2,"مقبول"],[1,"ضعيف"]];
  return `<div class="meta">انتهى الحجز. قيّم الزبون:</div><div class="row"><select id="rt" style="width:auto"><option value="">اختر التقييم</option>${opts.map(o=>`<option value="${o[0]}"${n(b.rating)===o[0]?" selected":""}>${stars(o[0])} ${o[1]}</option>`).join("")}</select><input id="rv" value="${esc(b.review)}" placeholder="ملاحظة عن الزبون" style="flex:1;min-width:140px"><button data-rate="${b.id}">حفظ التقييم</button></div>`;
}
let selDay=null;
const WD=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function showDay(ds){selDay=ds;drawCal()}
function drawDay(){
  if(!selDay||selDay.slice(0,7)!==$("month").value){$("day").innerHTML="";return}
  const ds=selDay,w=new Date(ds+"T00:00:00").getDay(),rate=(w===4||w===5)?RATE_HI:RATE;
  const b=data.find(x=>x.from<=ds&&x.to>=ds);
  let h=`<div class="bk"><div class="top"><strong>${WD[w]} ${ds}</strong><span class="tag ${b&&!isDone(b)&&b.status==="عربون"?"dep":""}">${b?(isDone(b)?"تم":"حجز"):"متاح"}</span></div><div class="meta">سعر اليوم: ${rate}</div>${FC[ds]?`<div class="meta">توقعات الجو: ${fcText(ds)}</div>`:""}`;
  if(b){
    const rest=n(b.total)-n(b.paid);
    const wl=WURL;
    h+=`<div class="meta">المستأجر: <strong>${esc(b.name)}</strong> (${esc(b.kind)})${b.persons?" · "+esc(b.persons)+" أشخاص":""}</div>
<div class="meta">مدة الحجز: من ${esc(b.from)} إلى ${esc(b.to)}</div>
<div class="meta">${esc(b.status)} · ${esc(b.method)} · المدفوع ${fmt(b.paid)} من ${fmt(b.total)}${n(b.discount)?" (بعد خصم "+fmt(b.discount)+")":""}${n(b.extra)?" (يشمل إضافي "+fmt(b.extra)+")":""} · المتبقي ${fmt(rest)}</div>
<div class="meta">المكان: ${LOC} · <a href="${wl}" target="_blank" rel="noopener">الطقس</a>${tmp(b)}</div>
${b.notes?`<div class="meta">ملاحظات: ${esc(b.notes)}</div>`:""}
${ratingBox(b)}<div class="row" style="margin-top:6px"><button class="ghost" data-e2="${b.id}">تعديل</button><button class="del" data-d2="${b.id}">حذف</button></div>`;
  }else h+=`<div class="row" style="margin-top:6px"><button id="bookDay">احجز هذا اليوم</button></div>`;
  $("day").innerHTML=h+"</div>";
}
function drawCal(){
  const [y,mo]=$("month").value.split("-").map(Number);
  if(!y){$("cal").innerHTML="";return}
  const days=new Date(y,mo,0).getDate();
  const first=new Date(y,mo-1,1).getDay();
  const names=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
  let h='<div class="cal">'+names.map(d=>`<div class="ch">${d}</div>`).join("");
  for(let i=0;i<first;i++)h+="<div></div>";
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const b=data.find(x=>x.from<=ds&&x.to>=ds);
    const sel=ds===selDay?" sel":"";
    h+=b?`<button type="button" class="cd bkd ${isDone(b)?"done":(b.status==="عربون"?"dep":"")}${sel}" data-day="${ds}"><span>${d}</span><small>${esc(b.name.split(" ")[0])}</small><small>${isDone(b)?"تم":"حجز"}</small></button>`:`<button type="button" class="cd${sel}" data-day="${ds}"><span>${d}</span></button>`;
  }
  $("cal").innerHTML=h+'</div><p class="meta">الأيام الملونة محجوزة (الأصفر عربون، الأخضر مدفوع بالكامل، الرمادي حجز منتهي مكتوب عليه «تم»). الأيام الفارغة متاحة. اضغط على أي يوم لعرض تفاصيله.</p>';
  drawDay();
}
function render(){
  drawCal();
  const m=$("month").value;
  const rows=data.filter(b=>b.from.slice(0,7)===m).sort((a,b)=>a.from.localeCompare(b.from));
  const total=rows.reduce((s,b)=>s+n(b.total),0);
  const paid=rows.reduce((s,b)=>s+n(b.paid),0);
  const cash=rows.filter(b=>b.method==="شام كاش").reduce((s,b)=>s+n(b.paid),0);
  const tr=rows.filter(b=>b.method==="تحويل").reduce((s,b)=>s+n(b.paid),0);
  const fam=rows.filter(b=>b.kind==="عائلة").length;
  $("sum").innerHTML=[
    [rows.length,"عدد الحجوزات"],[fam+" / "+(rows.length-fam),"عائلات / جروبات"],[rows.reduce((s,b)=>s+n(b.persons),0),"إجمالي الأشخاص"],
    [fmt(total),"إجمالي الأسعار (بعد الخصم)"],[fmt(rows.reduce((s,b)=>s+n(b.discount),0)),"إجمالي الخصومات"],[fmt(rows.reduce((s,b)=>s+n(b.extra),0)),"إجمالي المبالغ الإضافية"],[fmt(paid),"المقبوض"],[fmt(total-paid),"المتبقي"],
    [fmt(cash),"شام كاش"],[fmt(tr),"تحويل"]
  ].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
  if(!rows.length){$("list").innerHTML='<div class="empty">لا توجد حجوزات في هذا الشهر. أضف أول حجز من النموذج أعلاه.</div>';return}
  $("list").innerHTML=rows.map(b=>{
    const rest=n(b.total)-n(b.paid);
    const wl=WURL;
    return `<div class="bk">
<div class="top"><strong>${esc(b.name)}</strong>
<span><span class="tag">${esc(b.kind)}</span> <span class="tag ${b.status==="عربون"?"dep":""}">${esc(b.status)}</span>${isDone(b)?' <span class="tag">تم</span>':""}</span></div>
<div class="meta">من ${esc(b.from)} إلى ${esc(b.to)}${b.persons?" · "+esc(b.persons)+" أشخاص":""}</div>
<div class="meta">${esc(b.method)} · المدفوع ${fmt(b.paid)} من ${fmt(b.total)}${n(b.discount)?" (بعد خصم "+fmt(b.discount)+")":""}${n(b.extra)?" (يشمل إضافي "+fmt(b.extra)+")":""} · المتبقي ${fmt(rest)}</div>
<div class="meta">المكان: ${LOC} · <a href="${wl}" target="_blank" rel="noopener">الطقس</a>${tmp(b)}</div>
${b.notes?`<div class="meta">ملاحظات: ${esc(b.notes)}</div>`:""}
${ratingLine(b)}
<div class="row" style="margin-top:6px"><button class="ghost" data-e="${b.id}">تعديل</button><button class="del" data-d="${b.id}">حذف</button></div></div>`}).join("");
}
$("list").addEventListener("click",e=>{
  if(e.target.dataset.e)edit(e.target.dataset.e);
  if(e.target.dataset.d)remove(e.target.dataset.d);
});
$("month").addEventListener("change",render);
$("cal").addEventListener("click",e=>{const c=e.target.closest("[data-day]");if(c)showDay(c.dataset.day)});
$("day").addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.e2)edit(t.dataset.e2);
  if(t.dataset.d2)remove(t.dataset.d2);
  if(t.dataset.rate){const b=data.find(x=>x.id===t.dataset.rate);if(b){b.rating=$("rt").value;b.review=$("rv").value.trim();persist();render()}}
  if(t.id==="bookDay"){reset();$("from").value=selDay;$("to").value=selDay;calc();autoWeather();window.scrollTo({top:0,behavior:"smooth"});$("name").focus()}
});
render();
</script>
</body>
</html>
